name: api
on:
  push:
    paths: ["api/**", "contract/**", "scripts/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", "contract/**", "scripts/**", ".github/workflows/api.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore api/Vela.sln
      - run: dotnet build api/Vela.sln --no-restore
      - run: dotnet test api/Vela.sln --no-build --collect:"XPlat Code Coverage"
