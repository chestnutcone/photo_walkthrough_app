name: api
on:
  push:
    paths: ["api/**", "contract/**", "scripts/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", "contract/**", "scripts/**", ".github/workflows/api.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore api/Vela.sln
      - run: dotnet build api/Vela.sln --no-restore
      - run: dotnet test api/Vela.sln --no-build --collect:"XPlat Code Coverage"
