name: infra
on:
  pull_request:
    paths: ["infra/**", "scripts/validate-infra.sh", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", "scripts/validate-infra.sh", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "what-if previews only; deploy applies the template"
        type: choice
        options: [what-if, deploy]
        default: what-if
      budget-start-date:
        description: "Optional override, first of a month (yyyy-MM-01). Normally leave empty: the parameter file holds the fixed value."
        type: string
        default: ""
      parameters-file:
        description: "Parameter file under infra/"
        type: string
        default: parameters.dev.json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: az bicep install
      - name: Build, lint and check parameter files and wired settings
        run: ./scripts/validate-infra.sh

  # Runs only when started by hand. Azure access uses OIDC federated credentials: no client secret is stored.
  # Protect the "azure-infra" environment in repo settings (required reviewers) so "deploy" waits for approval.
  azure:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: azure-infra
    permissions:
      id-token: write
      contents: read
    env:
      PARAMETERS_FILE: infra/${{ inputs.parameters-file }}
      BUDGET_START: ${{ inputs.budget-start-date }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: |
          az deployment sub what-if \
            --location "${{ vars.AZURE_LOCATION || 'eastus2' }}" \
            --template-file infra/main.bicep \
            --parameters "$PARAMETERS_FILE" ${BUDGET_START:+budgetStartDate="$BUDGET_START"}
      - name: Deploy
        if: inputs.action == 'deploy'
        run: |
          # The database password is never passed here: set it from your own shell on first deploy or rotation (docs/deploy.md).
          az deployment sub create \
            --name "vela-${{ github.run_id }}" \
            --location "${{ vars.AZURE_LOCATION || 'eastus2' }}" \
            --template-file infra/main.bicep \
            --parameters "$PARAMETERS_FILE" ${BUDGET_START:+budgetStartDate="$BUDGET_START"}
