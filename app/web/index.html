<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `flutter build web --base-href` (default "/"). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F0E0D">
  <!-- Share pages (API /s/{id}) carry the preview tags and are what search
       engines and unfurlers should see. This app shell must not be indexed. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="A photo story viewer.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Placeholder: Flutter sets document.title from Branding.appName at startup. -->
  <title>Vela</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="viewer.css">
  <!-- No inline script or style: see web/README.md for the Content-Security-Policy. -->
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
